# uwuCurrency's apps: Android, Windows, macOS and Linux from one Flutter project, with the same
# features, words, stored data and API as the site in ../main-site (PORTING.md).
name: uwucurrency
description: "uwuCurrency: a simple currency converter, by UwU Apps."
publish_to: 'none'

# The version every platform shares: versionName+versionCode. build-apk.ps1 raises the code by one
# on every build (a phone, and Google Play, only take a higher one); raise the name yourself for a
# new version.
version: 1.0.1+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  crypto: ^3.0.6
  desktop_multi_window: ^0.3.1
  dynamic_color: ^1.8.1
  file_selector: ^1.1.0
  flutter_local_notifications: ^21.0.0
  fl_chart: ^1.1.1
  flutter_svg: ^2.2.0
  flutter_webrtc: ^1.6.3
  http: ^1.6.0
  image: ^4.12.0
  package_info_plus: ^10.0.0
  pasteboard: ^0.6.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  tray_manager: ^0.5.3
  url_launcher: ^6.3.3
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon-512.png
    - assets/images/icon-256.png
    - assets/images/tray.ico
    - assets/images/tray.png
    - assets/images/tray_template.png
  fonts:
    # The site's font, for the UwU Apps look. Material You uses the device's own.
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
