<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Page Not Found | UwU Currency API Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    <script>
        // No topbar here, so no theme button, but the saved choice still has
        // to land before first paint. Keep APP_KEY in sync with js/theme.js.
        (function () {
            var k = "uwuconvert-docs";
            var legacy = { classic: "classic", notgreen1: "not-green-1", notgreen2: "not-green-2", notgreen3: "not-green-3", notgreen4: "not-green-4", notgreen5: "not-green-5", white: "really-light-green" };
            var m = localStorage.getItem(k + ".mode") || "light";
            var c = localStorage.getItem(k + ".colorTheme") || legacy[localStorage.getItem("uwudocs.theme")] || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/docs.css">
    <meta name="theme-color" content="#ccffcc" />
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
</head>

<body>
    <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
        <div class="card" style="max-width:440px; text-align:center;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" style="width:52px;height:52px;margin:0 auto 14px;color:var(--brand-ink);">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />

            </svg>
            <h1 style="font-size:22px; font-weight:400; margin-bottom:8px;">Page not found</h1>
            <p style="color:var(--muted); margin-bottom:20px;">
                That page doesn't exist in the docs. Try searching, or head back to the overview.
            </p>
            <a href="/" class="btn btn--primary">Back to Overview</a>
        </div>
    </main>
</body>

</html>
